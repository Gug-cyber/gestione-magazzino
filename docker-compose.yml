services:
  db:
    image: postgres:15-alpine
    container_name: magazzino_db
    environment:
      POSTGRES_USER: magazzino
      POSTGRES_PASSWORD: magazzino
      POSTGRES_DB: magazzino
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magazzino"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: magazzino_backend
    environment:
      DATABASE_URL: postgresql://magazzino:magazzino@db:5432/magazzino
      SECRET_KEY: ${SECRET_KEY:-changeme-use-a-long-random-secret-key-in-production}
      APP_ENV: ${APP_ENV:-production}
      GROQ_API_KEY: ${GROQ_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      MARKET_BOT_TOKEN: ${MARKET_BOT_TOKEN}
      MARKET_CHAT_ID: ${MARKET_CHAT_ID}
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET}
      EBAY_REDIRECT_URI: ${EBAY_REDIRECT_URI}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - prodotti_uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GROQ_API_KEY: ${GROQ_API_KEY}
    container_name: magazzino_frontend
    environment:
      - VITE_API_TARGET=http://backend:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  tracking-scheduler:
    build: ./backend
    container_name: magazzino_tracking_scheduler
    command: python -m app.tasks.tracking_scheduler
    environment:
      DATABASE_URL: postgresql://magazzino:magazzino@db:5432/magazzino
      SECRET_KEY: ${SECRET_KEY:-changeme-use-a-long-random-secret-key-in-production}
      APP_ENV: ${APP_ENV:-production}
      GROQ_API_KEY: ${GROQ_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      MARKET_BOT_TOKEN: ${MARKET_BOT_TOKEN}
      MARKET_CHAT_ID: ${MARKET_CHAT_ID}
      TRACKING_UPDATE_INTERVAL_HOURS: ${TRACKING_UPDATE_INTERVAL_HOURS:-2}
      TRACKING_ENABLED: ${TRACKING_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  prodotti_uploads:
