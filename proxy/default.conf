server {
    listen 80;
    server_name retrovaultstore.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name retrovaultstore.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/retrovaultstore.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retrovaultstore.duckdns.org/privkey.pem;

    client_max_body_size 15M;

    # API backend
    location /api/ {
        proxy_pass http://magazzino_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Upload files backend
    location /uploads/ {
        proxy_pass http://magazzino_backend:8000;
        proxy_set_header Host $host;
    }

    # Pannello admin
    location /dashboard {
        proxy_pass http://magazzino_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Store clienti (root)
    location / {
        proxy_pass http://magazzino_ecommerce_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
