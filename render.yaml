# render.yaml - Configurazione deploy su Render.com
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: gestione-magazzino-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOW_LAN
        value: "false"
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: EBAY_ENV
        value: "PRODUCTION"
      - key: EBAY_VERIFICATION_TOKEN
        sync: false
      - key: EBAY_DELETION_ENDPOINT_URL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        sync: false
      - key: BACKUP_GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: BACKUP_RETENTION_DAYS
        value: "30"
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
    healthCheckPath: /health
