name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Safety
        run: pip install safety

      - name: Run Safety check (Python dependencies)
        run: |
          cd backend
          pip install -r requirements.txt
          safety check --json --output safety-report.json || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run npm audit (JavaScript dependencies)
        run: |
          cd frontend
          npm ci
          npm audit --json > npm-audit-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-reports
          path: |
            backend/safety-report.json
            frontend/npm-audit-report.json

  code-security-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit security scan
        run: |
          bandit -r backend/app -f json -o bandit-report.json || true
          bandit -r backend/app -f txt

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/python
            p/javascript
            p/sql

  codeql-analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  container-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t gestione-magazzino:test -f backend/Dockerfile backend/

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'gestione-magazzino:test'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  report-security-issues:
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-security-analysis]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Download security reports
        uses: actions/download-artifact@v4
        with:
          path: security-reports
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parse security reports
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python scripts/parse_security_reports.py
        continue-on-error: true

      - name: Create security issue
        if: hashFiles('security-issue-body.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_BODY=$(cat security-issue-body.md)
          PR_NUMBER="${{ github.event.pull_request.number }}"

          gh issue create \
            --title "[Security] Vulnerabilities detected in PR #${PR_NUMBER}" \
            --body "${ISSUE_BODY}" \
            --label "security,auto-fix" \
            --assignee "${{ github.event.pull_request.user.login }}"

      - name: Comment on PR
        if: hashFiles('security-summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUMMARY=$(cat security-summary.md)
          gh pr comment ${{ github.event.pull_request.number }} --body "${SUMMARY}"
