          **Tipo:** Missing HMAC Validation — Webhook Spoofing

          ### Descrizione
          L'endpoint webhook `POST /api/cms/webhook/product-updated` non valida la firma
          del payload ricevuto da Strapi. Chiunque può inviare richieste false a questo
          endpoint e manipolare i dati del magazzino. Il webhook è completamente aperto
          senza alcuna autenticazione o verifica di integrità.

          ### Codice vulnerabile
          ```python
          @router.post("/webhook/product-updated")
          async def handle_product_update_webhook(
              payload: dict,
              db: Session = Depends(get_db)
              # Nessuna validazione della firma!
          ):
          ```

          ### Fix raccomandato
          Aggiungere validazione HMAC-SHA256 usando un secret condiviso:

          ```python
          import hmac
          import hashlib

          CMS_WEBHOOK_SECRET = os.getenv("CMS_WEBHOOK_SECRET", "")

          @router.post("/webhook/product-updated")
          async def handle_product_update_webhook(
              request: Request,
              db: Session = Depends(get_db),
              x_strapi_signature: Optional[str] = Header(default=None),
          ):
              raw_body = await request.body()
              if CMS_WEBHOOK_SECRET:
                  if not x_strapi_signature:
                      raise HTTPException(status_code=401, detail="Firma webhook mancante")
                  expected = hmac.new(
                      CMS_WEBHOOK_SECRET.encode(), raw_body, hashlib.sha256
                  ).hexdigest()
                  if not hmac.compare_digest(expected, x_strapi_signature):
                      raise HTTPException(status_code=401, detail="Firma webhook non valida")
          ```

