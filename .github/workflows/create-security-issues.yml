name: Create Security Issues

on:
  workflow_dispatch:    # Manual trigger only
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-security-issues.yml'

permissions:
  contents: read
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # ── Create labels ──────────────────────────────────────────────────────
      - name: Create required labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "security" \
            --color "d73a4a" \
            --description "Security vulnerability" \
            --repo "${{ github.repository }}" 2>/dev/null || true

          gh label create "copilot" \
            --color "6366f1" \
            --description "Assigned to Copilot" \
            --repo "${{ github.repository }}" 2>/dev/null || true

          gh label create "auto-fix" \
            --color "e11d48" \
            --description "Automated fix requested" \
            --repo "${{ github.repository }}" 2>/dev/null || true

      # ── Create Issues ──────────────────────────────────────────────────────
      - name: Create security issues for identified vulnerabilities
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import urllib.request
          import urllib.parse

          REPO  = os.environ["REPO"]
          TOKEN = os.environ["GH_TOKEN"]

          VULNERABILITIES = [
              # ── HIGH ──────────────────────────────────────────────────────────────
              {
                  "title": "[Security][HIGH] Endpoint DELETE /api/prodotti/all e /api/fatture/all senza autenticazione admin",
                  "body": """## 🔴 Vulnerabilità di Sicurezza

          **Severità:** HIGH
          **File:** `backend/app/routers/prodotti.py` (riga 368), `backend/app/routers/fatture.py` (riga 126)
          **Tipo:** Missing Authorization — Privilege Escalation

          ### Descrizione
          Gli endpoint `DELETE /api/prodotti/all` e `DELETE /api/fatture/all` richiedono solo
          autenticazione generica (`get_current_active_user`), ma non verificano che l'utente
          sia un amministratore. Qualsiasi utente autenticato (anche con ruolo `guest` o `operatore`)
          può eliminare **tutti** i prodotti o tutte le fatture in un'unica richiesta.
          Questa è un'operazione irreversibile ad alto impatto.

          ### Codice vulnerabile
          ```python
          # prodotti.py
          @router.delete("/all", status_code=200)
          def delete_all_prodotti(db: Session = Depends(get_db), current_user=Depends(get_current_active_user)):
              # Nessun controllo is_admin!
              ...

          # fatture.py
          @router.delete("/all", status_code=200)
          def delete_all_fatture(db: Session = Depends(get_db), current_user=Depends(get_current_active_user)):
              # Nessun controllo is_admin!
              ...
          ```

          ### Fix raccomandato
          Sostituire `get_current_active_user` con `get_current_admin` (già disponibile in `backend/app/dependencies.py`).

          ```python
          from ..dependencies import get_current_admin

          @router.delete("/all", status_code=200)
          def delete_all_prodotti(db: Session = Depends(get_db), current_user=Depends(get_current_admin)):
              ...
          ```

