          @copilot Per favore fixa questa vulnerabilità di sicurezza:
          1. In `backend/app/routers/prodotti.py`: aggiungi l'import di `get_current_admin` da `..dependencies` e sostituisci `get_current_active_user` con `get_current_admin` nell'endpoint `DELETE /all`
          2. In `backend/app/routers/fatture.py`: stessa modifica per l'endpoint `DELETE /all`
          3. Esegui i test con `pytest backend/tests/` per verificare che il fix non rompa nulla
          4. Committa il fix su `main`
