          **File:** `.github/workflows/security.yml` (righe 88, 131)
          **Tipo:** Supply Chain Attack — Unpinned Actions

          ### Descrizione
          I workflow GitHub Actions usano riferimenti mutabili per alcune actions:
          - `returntocorp/semgrep-action@v1` — tag mutabile
          - `aquasecurity/trivy-action@master` — branch mutabile (molto pericoloso!)

