                  "body": """## 🟠 Vulnerabilità di Sicurezza

          **Severità:** MEDIUM
          **File:** `backend/app/main.py`
          **Tipo:** Missing Security Headers

          ### Descrizione
          Le risposte HTTP dell'API non includono header di sicurezza standard:
          - `X-Content-Type-Options: nosniff` — previene MIME sniffing
          - `X-Frame-Options: DENY` — previene clickjacking
          - `Strict-Transport-Security` — forza HTTPS
          - `Content-Security-Policy` — limita origini di risorse
          - `X-XSS-Protection: 1; mode=block` — protezione XSS legacy
          - `Referrer-Policy: strict-origin-when-cross-origin`

          Anche se l'applicazione è principalmente un'API REST (non una web app),
          questi header riducono la superficie di attacco.

          ### Fix raccomandato
          Aggiungere un middleware per security headers:

          ```python
          from fastapi.middleware.trustedhost import TrustedHostMiddleware
          from starlette.middleware.base import BaseHTTPMiddleware

          class SecurityHeadersMiddleware(BaseHTTPMiddleware):
              async def dispatch(self, request, call_next):
                  response = await call_next(request)
                  response.headers["X-Content-Type-Options"] = "nosniff"
                  response.headers["X-Frame-Options"] = "DENY"
                  response.headers["Referrer-Policy"] = "strict-origin-when-cross-origin"
                  return response

          app.add_middleware(SecurityHeadersMiddleware)
          ```

