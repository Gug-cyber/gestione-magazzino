          di quella action viene compromesso (supply chain attack), il codice malevolo
          viene eseguito automaticamente nel tuo CI/CD con accesso a secrets e token.

          ### Fix raccomandato
          Pinnare tutte le actions a commit SHA specifico:

          ```yaml
          # Invece di:
          uses: aquasecurity/trivy-action@master
          uses: returntocorp/semgrep-action@v1

          # Usare SHA specifico:
          uses: aquasecurity/trivy-action@76071ef0d7ac797a8a672e15702c4ea9c90e0ee4  # v0.28.0
          uses: semgrep/semgrep-action@v1  # (verificare SHA attuale)
