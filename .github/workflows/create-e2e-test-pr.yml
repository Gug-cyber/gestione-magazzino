name: Create E2E Test PR (Manual Fix Test)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  create-test-branch:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'copilot/teste2e-manual-fix-test'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main

      - name: Create test/e2e-manual-fix-test branch with intentional error and open PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            const branch = 'test/e2e-manual-fix-test';
            const filePath = 'backend/tests/test_prodotti.py';

            // Get the latest main SHA
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main'
            });
            const mainSha = ref.object.sha;
            core.info(`Main SHA: ${mainSha}`);

            // Create branch from main (or skip if it already exists)
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branch}`,
                sha: mainSha
              });
              core.info(`Branch ${branch} created from main`);
            } catch (e) {
              if (e.status === 422) {
                core.info(`Branch ${branch} already exists, will update file`);
              } else {
                throw e;
              }
            }

            // Get current file content from the branch
            const { data: fileData } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: filePath,
              ref: branch
            });

            const content = Buffer.from(fileData.content, 'base64').toString('utf8');
            core.info('File retrieved successfully');

            // Check if error already introduced
            if (content.includes('assert resp.status_code == 999')) {
              core.info('Intentional error already present, skipping commit');
            } else {
              // Introduce the intentional error in test_create_prodotto (first occurrence only)
              const pattern = /(def test_create_prodotto[\s\S]*?)(    assert resp\.status_code == 201)/;
              const replacement = `$1    # ERRORE INTENZIONALE: test del flusso auto-fix bot\n    assert resp.status_code == 999`;
              const newContent = content.replace(pattern, replacement);

              if (newContent === content) {
                core.setFailed('Replacement failed: target pattern not found in file. Verify test_prodotti.py has the expected assert in test_create_prodotto.');
                return;
              }

              // Commit the change
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: filePath,
                message: 'test: introduce intentional error in test_create_prodotto for e2e flow test',
                content: Buffer.from(newContent).toString('base64'),
                sha: fileData.sha,
                branch: branch
              });
              core.info(`Committed intentional error to ${branch}`);
            }

            // Check for existing open PR from this branch
            const { data: existingPrs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              base: 'main',
              state: 'open'
            });

            if (existingPrs.length > 0) {
              core.info(`PR #${existingPrs[0].number} already exists: ${existingPrs[0].html_url}`);
              return;
            }

            // Open the PR with the specified title and body
            const prBody = "## Test End-to-End Auto-Fix Bot Flow\n\nQuesta PR introduce un errore intenzionale in `test_create_prodotto` per verificare che il flusso automatico di fix funzioni correttamente:\n\n1. ❌ I test falliscono (assert 999 invece di 201)\n2. 💬 Il workflow commenta sulla PR con il report degli errori\n3. 🎫 Viene creata un'issue assegnata a @copilot\n4. 🔧 Copilot analizza e fixa l'errore committando sul branch\n5. 🔄 Il push attiva il re-test automatico\n6. ✅ I test passano → merge automatico\n\n**Nota**: Questo è un test intenzionale del sistema di automazione CI/CD.";

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'test: verifica flusso end-to-end auto-fix bot [manuale]',
              body: prBody,
              head: branch,
              base: 'main'
            });
            core.info(`PR #${pr.number} created: ${pr.html_url}`);
