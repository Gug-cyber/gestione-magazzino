name: Create E2E Test Branch

on:
  workflow_dispatch:

jobs:
  create-test-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Create test branch and introduce intentional error
        uses: actions/github-script@v7
        with:
          script: |
            const branch = 'test/e2e-auto-fix';
            const filePath = 'backend/tests/test_prodotti.py';

            // Get the latest main SHA
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main'
            });
            const mainSha = ref.object.sha;

            // Create the test branch from main
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branch}`,
                sha: mainSha
              });
              core.info(`Branch ${branch} created from main`);
            } catch (e) {
              if (e.status === 422) {
                core.info(`Branch ${branch} already exists, updating it`);
                await github.rest.git.updateRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`,
                  sha: mainSha,
                  force: true
                });
              } else {
                throw e;
              }
            }

            // Get current file content
            const { data: fileData } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: filePath,
              ref: branch
            });

            const content = Buffer.from(fileData.content, 'base64').toString('utf8');

            // Introduce the intentional error
            const newContent = content.replace(
              'assert resp.status_code == 201',
              '# ERRORE INTENZIONALE: test del flusso auto-fix bot\n    assert resp.status_code == 999'
            );

            if (newContent === content) {
              core.warning('No replacement was made - the assert line was not found or already changed.');
            }

            // Commit the change
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: filePath,
              message: 'test: introduce intentional error to test end-to-end auto-fix bot flow',
              content: Buffer.from(newContent).toString('base64'),
              sha: fileData.sha,
              branch: branch
            });

            core.info(`Committed intentional error to ${branch}`);

            // Check if a PR already exists for this branch
            const { data: existingPulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              base: 'main',
              state: 'open'
            });

            let pr;
            if (existingPulls.length > 0) {
              pr = existingPulls[0];
              core.info(`PR #${pr.number} already exists: ${pr.html_url}`);
            } else {
              const { data: newPr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'test: verifica flusso end-to-end auto-fix bot',
                body: `## Test End-to-End Auto-Fix Bot Flow\n\nQuesta PR introduce un errore intenzionale in \`test_create_prodotto\` per verificare che il flusso automatico di fix funzioni correttamente:\n\n1. ❌ I test falliscono (assert 999 invece di 201)\n2. 💬 Il workflow commenta sulla PR con il report degli errori\n3. 🎫 Viene creata un'issue assegnata a @copilot\n4. 🔧 Copilot analizza e fixa l'errore committando sul branch\n5. 🔄 Il push attiva il re-test automatico\n6. ✅ I test passano → merge automatico\n\n**Nota**: Questo è un test intenzionale del sistema di automazione CI/CD.`,
                head: branch,
                base: 'main'
              });
              pr = newPr;
              core.info(`PR #${pr.number} created: ${pr.html_url}`);
            }
