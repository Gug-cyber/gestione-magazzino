name: Create E2E Test Branch

on:
  workflow_dispatch:

jobs:
  create-test-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Create test branch and introduce intentional error
        uses: actions/github-script@v7
        with:
          script: |
            // toISOString gives e.g. "2026-04-07T07:44:58.255Z"; after replacing ':' and '.'
            // with '-', slice(0,19) keeps "2026-04-07T07-44-58" (drops milliseconds and 'Z')
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
            const branch = `test/e2e-auto-fix-${timestamp}`;
            const filePath = 'backend/tests/test_prodotti.py';

            core.info(`Branch name: ${branch}`);

            // Get the latest main SHA
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main'
            });
            const mainSha = ref.object.sha;

            // Create the test branch from main (timestamp ensures no conflicts)
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${branch}`,
              sha: mainSha
            });
            core.info(`Branch ${branch} created from main (SHA: ${mainSha})`);

            // Get current file content
            const { data: fileData } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: filePath,
              ref: branch
            });

            const content = Buffer.from(fileData.content, 'base64').toString('utf8');

            // Diagnostic: log first 20 lines and count target occurrences
            const lines = content.split('\n');
            core.info('--- First 20 lines of file (before replacement) ---');
            lines.slice(0, 20).forEach((line, i) => core.info(`${i + 1}: ${line}`));

            const targetStr = '    assert resp.status_code == 201';
            const occurrences = (content.match(/    assert resp\.status_code == 201/g) || []).length;
            core.info(`Found ${occurrences} occurrence(s) of '${targetStr}'`);

            // Introduce the intentional error ONLY in test_create_prodotto (first occurrence).
            // The lazy quantifier [\s\S]*? stops at the first _crea_prodotto call found within
            // the function, so this only affects test_create_prodotto even if other functions
            // also call _crea_prodotto with different signatures.
            const pattern = /(def test_create_prodotto[\s\S]*?_crea_prodotto\(client, auth_headers\)\n)(    assert resp\.status_code == 201)/;
            const replacement = `$1    # ERRORE INTENZIONALE: test del flusso auto-fix bot\n    assert resp.status_code == 999`;

            const newContent = content.replace(pattern, replacement);

            if (newContent === content) {
              core.setFailed('Replacement failed: target string not found in file. Verify that test_prodotti.py contains the expected assert line in test_create_prodotto.');
              return;
            }

            // Diagnostic: log first 20 lines after replacement
            const newLines = newContent.split('\n');
            core.info('--- First 20 lines of file (after replacement) ---');
            newLines.slice(0, 20).forEach((line, i) => core.info(`${i + 1}: ${line}`));

            // Commit the change
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: filePath,
              message: `test: introduce intentional error to test end-to-end auto-fix bot flow [${timestamp}]`,
              content: Buffer.from(newContent).toString('base64'),
              sha: fileData.sha,
              branch: branch
            });

            core.info(`Committed intentional error to ${branch}`);

            // Create a new PR (branch is always unique, no existing PR to worry about)
            const { data: newPr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `test: verifica flusso end-to-end auto-fix bot [${timestamp}]`,
              body: `## Test End-to-End Auto-Fix Bot Flow\n\n**Branch**: \`${branch}\`\n**Timestamp**: \`${timestamp}\`\n\nQuesta PR introduce un errore intenzionale in \`test_create_prodotto\` per verificare che il flusso automatico di fix funzioni correttamente:\n\n1. ❌ I test falliscono (assert 999 invece di 201)\n2. 💬 Il workflow commenta sulla PR con il report degli errori\n3. 🎫 Viene creata un'issue assegnata a @copilot\n4. 🔧 Copilot analizza e fixa l'errore committando sul branch\n5. 🔄 Il push attiva il re-test automatico\n6. ✅ I test passano → merge automatico\n\n**Nota**: Questo è un test intenzionale del sistema di automazione CI/CD.`,
              head: branch,
              base: 'main'
            });
            core.info(`PR #${newPr.number} created: ${newPr.html_url}`);
