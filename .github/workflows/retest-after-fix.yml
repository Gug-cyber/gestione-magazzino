name: Re-test After Auto-Fix

on:
  push:
    branches-ignore:
      - main
      - develop

jobs:
  check-if-auto-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is-auto-fix: ${{ steps.check.outputs.is-auto-fix }}

    steps:
      - uses: actions/checkout@v4

      - name: Check if commit is from Copilot
        id: check
        run: |
          author=$(git log -1 --pretty=format:'%an')
          author_email=$(git log -1 --pretty=format:'%ae')
          if [[ "$author" == *"copilot"* ]] || [[ "$author_email" == *"copilot"* ]] || [[ "$author_email" == "github-actions[bot]@users.noreply.github.com" ]]; then
            echo "is-auto-fix=true" >> $GITHUB_OUTPUT
          else
            echo "is-auto-fix=false" >> $GITHUB_OUTPUT
          fi

  retest:
    needs: check-if-auto-fix
    if: needs.check-if-auto-fix.outputs.is-auto-fix == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Find associated PR and comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
              state: 'open'
            });

            if (pulls.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pulls[0].number,
                body: '🔄 **Auto-fix committed!** Re-running tests...'
              });
            }
