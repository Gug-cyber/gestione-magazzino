name: Re-test After Auto-Fix

on:
  push:
    branches-ignore:
      - main
      - develop

jobs:
  run-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    outputs:
      tests-passed: ${{ steps.test-result.outputs.passed }}
      error-report: ${{ steps.test-result.outputs.report }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Install Node dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Backend Tests
        id: backend-tests
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: |
          cd backend
          pytest -v --tb=short > ../test-backend-output.txt 2>&1
          echo "backend_exit_code=$?" >> $GITHUB_OUTPUT

      - name: Run Frontend Tests
        id: frontend-tests
        continue-on-error: true
        run: |
          cd frontend
          npm run test > ../test-frontend-output.txt 2>&1
          echo "frontend_exit_code=$?" >> $GITHUB_OUTPUT

      - name: Aggregate Test Results
        id: test-result
        run: |
          backend_code=${{ steps.backend-tests.outputs.backend_exit_code }}
          frontend_code=${{ steps.frontend-tests.outputs.frontend_exit_code }}

          if [ "$backend_code" = "0" ] && [ "$frontend_code" = "0" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT

            echo "## 🔴 Test Failures Detected" > error-report.md
            if [ "$backend_code" != "0" ]; then
              echo "### Backend Tests Failed" >> error-report.md
              echo '```' >> error-report.md
              tail -50 test-backend-output.txt >> error-report.md
              echo '```' >> error-report.md
            fi
            if [ "$frontend_code" != "0" ]; then
              echo "### Frontend Tests Failed" >> error-report.md
              echo '```' >> error-report.md
              tail -50 test-frontend-output.txt >> error-report.md
              echo '```' >> error-report.md
            fi

            echo "report<<EOF" >> $GITHUB_OUTPUT
            cat error-report.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

  notify-pr:
    needs: run-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Comment and auto-merge if passing
        uses: actions/github-script@v7
        env:
          ERROR_REPORT: ${{ needs.run-tests.outputs.error-report }}
          TESTS_PASSED: ${{ needs.run-tests.outputs.tests-passed }}
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });

            if (pulls.length === 0) {
              core.info('No open PR found for this branch. Skipping.');
              return;
            }

            const prNumber = pulls[0].number;
            const passed = process.env.TESTS_PASSED === 'true';

            if (passed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: '✅ **All tests passed!** Auto-merging this PR...'
              });
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  merge_method: 'squash'
                });
              } catch (e) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: `⚠️ Tests passed but auto-merge failed: ${e.message}. Please merge manually.`
                });
              }
            } else {
              const errorReport = process.env.ERROR_REPORT || '_(No error details available)_';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `❌ **Tests still failing.**\n\n${errorReport}`
              });
            }
