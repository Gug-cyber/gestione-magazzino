name: Auto Test-Fix-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["Create E2E Test Branch"]
    types: [completed]
  workflow_dispatch:

jobs:
  find-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pr-number: ${{ steps.find.outputs.pr-number }}
      head-ref: ${{ steps.find.outputs.head-ref }}
      head-sha: ${{ steps.find.outputs.head-sha }}
      should-run: ${{ steps.find.outputs.should-run }}
    steps:
      - name: Find PR
        id: find
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'pull_request') {
              core.setOutput('pr-number', context.payload.pull_request.number);
              core.setOutput('head-ref', context.payload.pull_request.head.ref);
              core.setOutput('head-sha', context.payload.pull_request.head.sha);
              core.setOutput('should-run', 'true');
              return;
            }

            // workflow_run: cerca la PR aperta più recente su branch test/e2e-auto-fix-*
            if (context.payload.workflow_run?.conclusion !== 'success') {
              core.info('Workflow run did not succeed, skipping.');
              core.setOutput('should-run', 'false');
              return;
            }

            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'created',
              direction: 'desc',
              per_page: 10
            });

            const testPR = pulls.find(pr => pr.head.ref.startsWith('test/e2e-auto-fix-'));
            if (!testPR) {
              core.warning('No open test/e2e-auto-fix-* PR found.');
              core.setOutput('should-run', 'false');
              return;
            }

            core.info(`Found PR #${testPR.number}: ${testPR.head.ref}`);
            core.setOutput('pr-number', testPR.number);
            core.setOutput('head-ref', testPR.head.ref);
            core.setOutput('head-sha', testPR.head.sha);
            core.setOutput('should-run', 'true');

  run-tests:
    needs: find-pr
    if: needs.find-pr.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db

    outputs:
      tests-passed: ${{ steps.test-result.outputs.passed }}
      error-report: ${{ steps.test-result.outputs.report }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.find-pr.outputs.head-sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install pytest-cov

      - name: Install Node dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Backend Tests
        id: backend-tests
        continue-on-error: true
        run: |
          set +e
          cd backend
          pytest -v --tb=short > ../test-backend-output.txt 2>&1
          backend_exit=$?
          echo "backend_exit_code=$backend_exit" >> $GITHUB_OUTPUT

      - name: Run Security Tests
        id: security-tests
        continue-on-error: true
        run: |
          set +e
          cd backend
          pytest tests/security/ -v --tb=short > ../test-security-output.txt 2>&1
          security_exit=$?
          echo "security_exit_code=$security_exit" >> $GITHUB_OUTPUT

      - name: Run Frontend Tests
        id: frontend-tests
        continue-on-error: true
        run: |
          set +e
          cd frontend
          npm run test > ../test-frontend-output.txt 2>&1
          frontend_exit=$?
          echo "frontend_exit_code=$frontend_exit" >> $GITHUB_OUTPUT

      - name: Run Bandit Security Scan
        id: bandit-scan
        continue-on-error: true
        run: |
          set +e
          pip install bandit
          bandit -r backend/app -f txt --severity-level medium > test-bandit-output.txt 2>&1
          bandit_exit=$?
          echo "bandit_exit_code=$bandit_exit" >> $GITHUB_OUTPUT

      - name: Aggregate Test Results
        id: test-result
        run: |
          backend_code="${{ steps.backend-tests.outputs.backend_exit_code || '1' }}"
          security_code="${{ steps.security-tests.outputs.security_exit_code || '1' }}"
          frontend_code="${{ steps.frontend-tests.outputs.frontend_exit_code || '1' }}"
          bandit_code="${{ steps.bandit-scan.outputs.bandit_exit_code || '1' }}"

          if [ "$backend_code" = "0" ] && [ "$security_code" = "0" ] && [ "$frontend_code" = "0" ] && [ "$bandit_code" = "0" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "✅ All tests passed!"
          else
            echo "passed=false" >> $GITHUB_OUTPUT

            # Create error report
            echo "## 🔴 Test Failures Detected" > error-report.md
            echo "" >> error-report.md

            if [ "$backend_code" != "0" ]; then
              echo "### Backend Tests Failed" >> error-report.md
              echo '```' >> error-report.md
              tail -50 test-backend-output.txt >> error-report.md
              echo '```' >> error-report.md
              echo "" >> error-report.md
            fi

            if [ "$security_code" != "0" ]; then
              echo "### Security Tests Failed" >> error-report.md
              echo '```' >> error-report.md
              tail -50 test-security-output.txt >> error-report.md
              echo '```' >> error-report.md
              echo "" >> error-report.md
            fi

            if [ "$frontend_code" != "0" ]; then
              echo "### Frontend Tests Failed" >> error-report.md
              echo '```' >> error-report.md
              tail -50 test-frontend-output.txt >> error-report.md
              echo '```' >> error-report.md
              echo "" >> error-report.md
            fi

            if [ "$bandit_code" != "0" ]; then
              echo "### Bandit Security Scan Failed" >> error-report.md
              echo '```' >> error-report.md
              tail -50 test-bandit-output.txt >> error-report.md
              echo '```' >> error-report.md
            fi

            echo "report<<EOF" >> $GITHUB_OUTPUT
            cat error-report.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Upload Test Outputs
        if: steps.test-result.outputs.passed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs
          path: |
            test-*.txt
            error-report.md

  copilot-fix:
    needs: [find-pr, run-tests]
    if: needs.find-pr.outputs.should-run == 'true' && needs.run-tests.outputs.tests-passed == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.find-pr.outputs.head-ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap Labels
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'auto-fix',
                color: 'e11d48',
                description: 'Automated fix requested'
              });
            } catch (e) {
              if (e.status !== 422) throw e; // 422 = label already exists
            }

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'copilot',
                color: '6366f1',
                description: 'Assigned to GitHub Copilot for auto-fix'
              });
            } catch (e) {
              if (e.status !== 422) throw e;
            }

      - name: Comment on PR with errors
        uses: actions/github-script@v7
        env:
          ERROR_REPORT: ${{ needs.run-tests.outputs.error-report }}
          PR_NUMBER: ${{ needs.find-pr.outputs.pr-number }}
        with:
          script: |
            const errorReport = process.env.ERROR_REPORT;
            const prNumber = parseInt(process.env.PR_NUMBER);

            const comment = `
            ${errorReport}

            ---

            🤖 **Copilot is now analyzing these failures and will attempt to fix them automatically.**

            Please wait for the automated fix to be committed to this PR.
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });

      - name: Create Issue for Copilot
        id: create-issue
        uses: actions/github-script@v7
        env:
          ERROR_REPORT: ${{ needs.run-tests.outputs.error-report }}
          PR_NUMBER: ${{ needs.find-pr.outputs.pr-number }}
          HEAD_REF: ${{ needs.find-pr.outputs.head-ref }}
          HEAD_SHA: ${{ needs.find-pr.outputs.head-sha }}
        with:
          script: |
            const errorReport = process.env.ERROR_REPORT;
            const prNumber = parseInt(process.env.PR_NUMBER);
            const headRef = process.env.HEAD_REF;
            const headSha = process.env.HEAD_SHA;

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Auto-Fix] Test failures in PR #${prNumber}`,
              body: `
            ## Test Failures Report

            ${errorReport}

            ---

            **PR:** #${prNumber}
            **Branch:** ${headRef}
            **Commit:** ${headSha}

            @copilot Please analyze these test failures and fix them. Once fixed, commit the changes to the branch \`${headRef}\`.

            ## Context

            This is an automated request from the CI/CD pipeline. The tests failed after the latest commit. Please:

            1. Analyze the error messages above
            2. Identify the root cause
            3. Fix the issues in the appropriate files
            4. Commit the fixes to branch \`${headRef}\`

            The workflow will automatically re-run tests after your fix.
            `,
              labels: ['auto-fix', 'copilot']
            });

            return issue.data.number;

  auto-merge:
    needs: [find-pr, run-tests]
    if: needs.find-pr.outputs.should-run == 'true' && needs.run-tests.outputs.tests-passed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Auto-merge PR
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.find-pr.outputs.pr-number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '✅ **All tests passed!** Auto-merging this PR...'
            });

            // First try direct merge
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'squash'
              });
              core.info(`PR #${prNumber} merged successfully.`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: '🎉 **PR merged successfully!**'
              });
              return;
            } catch (e) {
              core.warning(`Direct merge failed: ${e.message}. Trying GraphQL enablePullRequestAutoMerge...`);
            }

            // Fallback: enable auto-merge via GraphQL
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });

              await github.graphql(`
                mutation EnableAutoMerge($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: SQUASH
                  }) {
                    pullRequest {
                      autoMergeRequest {
                        enabledAt
                      }
                    }
                  }
                }
              `, { pullRequestId: pr.node_id });

              core.info(`Auto-merge enabled for PR #${prNumber}`);
            } catch (e2) {
              core.warning(`Auto-merge via GraphQL also failed: ${e2.message}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `⚠️ Tests passed but auto-merge failed: ${e2.message}. Please merge manually.`
              });
            }
