name: 🗄️ Backup Notturno DB

on:
  schedule:
    # Ogni notte alle 04:00 UTC.
    # Il giorno 1 del mese viene eseguito DOPO backup-monthly.yml (03:00 UTC)
    # garantendo l'ordine corretto: prima backup applicativo, poi backup DB.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-db:
    name: Backup PostgreSQL → GitHub Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Esegui pg_dump
        env:
          # Configurare in GitHub → Settings → Secrets and variables → Actions
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ Secret DATABASE_URL non configurato"
            exit 1
          fi

          TIMESTAMP=$(date '+%Y%m%d_%H%M%S')
          LABEL=$([ "$(date +%u)" = "7" ] && echo "full" || echo "incremental")
          FILENAME="db_${LABEL}_${TIMESTAMP}.sql.gz"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"

          echo "🗄️ Avvio pg_dump: $FILENAME"
          pg_dump --no-password --format=plain --no-owner --no-privileges "$DATABASE_URL" | gzip > "/tmp/$FILENAME"
          SIZE=$(du -sh "/tmp/$FILENAME" | cut -f1)
          echo "✅ Dump completato: $FILENAME ($SIZE)"

      - name: Salva backup come artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}
          path: /tmp/${{ env.FILENAME }}
          retention-days: 90

      - name: Notifica fallimento
        if: failure()
        run: |
          echo "❌ ATTENZIONE: Backup DB FALLITO il $(date '+%Y-%m-%d %H:%M UTC')"
          exit 1
